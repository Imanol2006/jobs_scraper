    - "campus"
    - "intern"
    - "internship"
    - "co-op"
    - "co op"
    - "graduate program"
    - "graduate engineer"
    - "rotational"
    - "apprentice"
    - "associate "
    # Bare "resident"/"fellow" are avoided on purpose: "resident" is a substring
    # of "president", and a "Technical Fellow" is the most senior IC there is.
    - "residency"
    - "ai resident"
    - "research resident"
    - "fellowship"
    - " i "
    - " 1 "
    - "junior"
    - "level 1"
    - "l1 "
  # Titles containing these are dropped even if they matched above (too senior).
  seniority_block:
