# ---------------------------------------------------------------------------
# tech-jobs tracker configuration
# Everything the pipeline needs lives here so you never edit code to tune it.
#
# Every ats_targets entry below was verified live (see `python -m src.discover
# --verify`). `tier` drives shortlist weighting in src/fit.py:
#   frontier_lab > big_tech > ai_infra > tech > "" (unknown / aggregator-only)
# ---------------------------------------------------------------------------

nasdaq_universe:
  # Official Nasdaq-listed symbols (authoritative membership).
  listed_symbols_csv: "https://raw.githubusercontent.com/datasets/nasdaq-listings/main/data/nasdaq-listed.csv"
  # Screener export that adds industry + market cap + clean names.
  # Intersected with listed_symbols_csv so only true Nasdaq companies survive.
  enrichment_csv: "https://raw.githubusercontent.com/Ate329/top-us-stock-tickers/main/tickers/all.csv"
  # Cache the two CSVs locally for this many hours (0 disables). They change
  # slowly, and a cache means a bad upstream day can't take the whole run down.
  cache_hours: 20
  cache_dir: "data/cache"

aggregators:
  # SimplifyJobs-style machine-readable listings. role_type is per source.
  - name: "Simplify New Grad"
    url: "https://raw.githubusercontent.com/SimplifyJobs/New-Grad-Positions/dev/.github/scripts/listings.json"
    role_type: "new_grad"
  - name: "Simplify Internships (Summer 2026)"
    url: "https://raw.githubusercontent.com/SimplifyJobs/Summer2026-Internships/dev/.github/scripts/listings.json"
    role_type: "intern"
  - name: "Simplify Internships (Summer 2027)"
    url: "https://raw.githubusercontent.com/SimplifyJobs/Summer2027-Internships/dev/.github/scripts/listings.json"
    role_type: "intern"
  - name: "New Grad 2026 (community)"
    url: "https://raw.githubusercontent.com/vanshb03/New-Grad-2026/dev/.github/scripts/listings.json"
    role_type: "new_grad"
  # The Simplify feeds already carry Fall/Winter/Spring off-season roles (tagged
  # in `terms`); this community feed adds extra off-season coverage.
  - name: "Off-Season Internships (community)"
    url: "https://raw.githubusercontent.com/vanshb03/Summer2027-Internships/dev/.github/scripts/listings.json"
    role_type: "intern"

# Big-tech career sites with their own API (see src/sources/bigtech.py for why
# Microsoft / Apple / Google / Meta are covered via aggregators instead).
bigtech:
  amazon:
    - {name: "Amazon ML/Science", categories: ["machine-learning-science"], max_pages: 6}
    - {name: "Amazon Data Science", categories: ["data-science"], max_pages: 3}
    # amazon.jobs ANDs the words in base_query, so "university graduate" matches
    # nothing. Keep the terms separate.
    - {name: "Amazon University", base_query: "university", max_pages: 4}
    - {name: "Amazon Graduate", base_query: "graduate", max_pages: 4}
    - {name: "Amazon Internships", base_query: "intern", max_pages: 6}
    - {name: "Amazon SDE I", base_query: "software development engineer I", max_pages: 4}

matching:
  # Fuzzy company-name match threshold (0-100). Higher = stricter, fewer false hits.
  fuzzy_cutoff: 92

# How many boards to poll at once. Each is a different host, so this is polite;
# raise it if runs feel slow, lower it if you start seeing 429s.
concurrency: 12

