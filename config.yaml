# ---- Role classification keywords (case-insensitive substring match) ----
classify:
  # A job is kept only if it looks like an early-career role.
  early_career_any:
    - "new grad"
    - "new graduate"
    - "new college grad"
    - "university grad"
    - "university hire"
    - "college grad"
    - "early career"
    - "early-career"
    - "entry level"
