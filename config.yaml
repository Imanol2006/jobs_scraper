output:
  csv_path: "data/jobs.csv"
  html_path: "docs/index.html"
  state_path: "data/seen.json"
  health_path: "data/health.json"
  # A job stays on the board this many days after it first disappears from sources.
  keep_stale_days: 5
  # Refuse to overwrite the site if a run collects fewer than this many roles —
  # that means sources broke, not that the market emptied out.
  min_jobs_to_publish: 500
  # Owner name shown in the page header. Cosmetic.
  owner: "Imanol's job board"
